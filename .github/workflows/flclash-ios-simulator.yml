name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [flclash]

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphone|appletv|macosx"
          brew install xcodegen
          python3 -m venv .build/python-env
          .build/python-env/bin/python -m pip install --quiet PyYAML

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ hashFiles('Dependencies.lock.json') }}
          restore-keys: go-${{ runner.os }}-

      # The kernel SDK takes most of the run to build and only changes with
      # the kernel revision (or the toolchain that builds it), so it is
      # cached under that key. On a hit the kernel is cloned at the pinned
      # revision and the cached SDK and its inventory receipt are put where
      # bootstrap.py looks: it then verifies them (every slice's build info
      # must name the pinned revision, clean) instead of rebuilding.
      - name: Kernel SDK cache key
        id: sdk-key
        run: |
          rev=$(python3 -c 'import json;print(json.load(open("Dependencies.lock.json"))["kernel"]["revision"])')
          tools=$(python3 -c 'import json;l=json.load(open("Dependencies.lock.json"));print(l["gomobile"].rsplit("@",1)[-1])')
          echo "key=clash-sdk-v1-${rev}-go1.26.10-gomobile${tools}-$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Restore kernel SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/sdk-cache
          key: ${{ steps.sdk-key.outputs.key }}

      - name: Seed the cached kernel SDK
        if: steps.sdk-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          repo=$(python3 -c 'import json;print(json.load(open("Dependencies.lock.json"))["kernel"]["repository"])')
          rev=$(python3 -c 'import json;print(json.load(open("Dependencies.lock.json"))["kernel"]["revision"])')
          mkdir -p .build/dependencies
          git clone --quiet "$repo" .build/dependencies/kernel
          git -C .build/dependencies/kernel checkout --quiet --detach "$rev"
          mv .build/sdk-cache/Clash.xcframework .build/dependencies/kernel/Clash.xcframework
          mv .build/sdk-cache/sdk-inventory.json .build/dependencies/sdk-inventory.json
          echo "Reusing the kernel SDK built for $rev"

      - name: Bootstrap (build the pinned kernel SDK from source)
        run: .build/python-env/bin/python scripts/bootstrap.py

      - name: Stage the kernel SDK for the cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .build/sdk-cache
          ditto .build/dependencies/kernel/Clash.xcframework .build/sdk-cache/Clash.xcframework
          cp .build/dependencies/sdk-inventory.json .build/sdk-cache/sdk-inventory.json

      - name: Save kernel SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/sdk-cache
          key: ${{ steps.sdk-key.outputs.key }}

      - name: Configure (XcodeGen project and macOS CLI helper)
        run: .build/python-env/bin/python scripts/configure.py

      - name: Build ClashiOS for iPhone (unsigned, no codesign)
        run: |
          set -o pipefail
          xcodebuild -project apple/ClashClient/ClashClient.xcodeproj \
            -scheme ClashiOS -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            build 2>&1 | tee .build/xcodebuild-iphoneos.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" .build/xcodebuild-iphoneos.log

      - name: Package unsigned iPhone IPA
        run: |
          set -euo pipefail
          app=.build/DerivedData/Build/Products/Release-iphoneos/Clash.app
          test -d "$app"
          mkdir -p .build/ipa/Payload .build/ipa-artifacts/entitlements
          # Fresh Payload each run
          rm -rf .build/ipa/Payload/*
          ditto "$app" .build/ipa/Payload/Clash.app
          # Entitlements from XcodeGen outputs / DerivedData (unsigned bins rarely embed them)
          while IFS= read -r f; do
            base=$(basename "$f")
            cp "$f" ".build/ipa-artifacts/entitlements/$base"
          done < <(find apple/ClashClient .build/DerivedData/Build/Intermediates.noindex \
            -name '*.entitlements' -o -name '*.xcent' 2>/dev/null | head -40)
          # Best-effort dump from any Mach-O that already carries entitlements
          if command -v codesign >/dev/null; then
            find .build/ipa/Payload/Clash.app -type f -perm -111 | while read -r bin; do
              rel=${bin#.build/ipa/Payload/Clash.app/}
              safe=$(printf '%s' "$rel" | tr '/ ' '__')
              codesign -d --entitlements :- "$bin" > ".build/ipa-artifacts/entitlements/codesign-$safe.plist" 2>/dev/null || true
            done
            find .build/ipa-artifacts/entitlements -name 'codesign-*.plist' -size 0 -delete
          fi
          ls -la .build/ipa-artifacts/entitlements || true
          (
            cd .build/ipa
            zip -qry ../ipa-artifacts/Clash-flclash-unsigned.ipa Payload
          )
          cp .build/xcodebuild-iphoneos.log .build/ipa-artifacts/
          ls -la .build/ipa-artifacts
          unzip -l .build/ipa-artifacts/Clash-flclash-unsigned.ipa | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: clash-ios-unsigned-ipa
          path: .build/ipa-artifacts
          if-no-files-found: error
          retention-days: 14
